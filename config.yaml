# CXY-Agent 配置文件
# 编辑后无需重启，每次跑都会重新读
# 关键词本体在 keyword.md（产/研/学三章），本文件只管排期、检索式、源与推送参数

# ---------- 每周排期 ----------
# 按 weekday 把每天绑到一个板块,只抓该板块的关键词、只让 scorer 关心该板块
# weekday: 0=周一, 1=周二, 2=周三, 3=周四, 4=周五, 5=周六, 6=周日
# 避开 News-Agent 的周一/三/五/日排期；不在表里的日子直接退出
schedule:
  weekday_category:
    1: industry   # 周二: 产·产业与实践
    3: research   # 周四: 研·技术与科研
    5: academia   # 周六: 学·学习与成长

# ---------- 推送配置 ----------
push:
  # 单次推送的事件数上限（摘要的 token 成本主要来自这里）
  max_articles: 20
  # 单条事件的四维加权总分阈值（0-10），低于此分不推送
  min_score: 6.0
  # PushPlus 推送主题模板（{category_label} {date} 会被替换）
  title_template: "{category_label}一周动态汇总 {date}"

# ---------- 板块展示名 ----------
# 用于推送标题、正文标题、日志与落盘文件名
category_labels:
  industry: "产·产业实践"
  research: "研·技术科研"
  academia: "学·学习成长"

# ---------- 四维价值终评权重 ----------
# 对应 README「智能体核心机制」：相关性/创新性/证据强度/可行动性（自动归一化）
scoring:
  weights:
    relevance: 0.30      # 相关性
    innovation: 0.25     # 创新性
    evidence: 0.25       # 证据强度
    actionability: 0.20  # 可行动性

# ---------- DeepSeek API 配置 ----------
deepseek:
  scorer_model: "deepseek-chat"
  summarizer_model: "deepseek-chat"
  scorer_batch_size: 20

# ---------- 两阶段筛选 ----------
# 先以标题/RSS 摘要粗筛，再仅为候选抓正文做终评，兼顾质量与 API/网络成本。
research_filter:
  # 粗筛分数低于此值不抓正文；4.0 可保留“相关但信息尚不完整”的线索。
  coarse_min_score: 4.0
  # 每个板块最多补抓正文的候选数，防止宽泛查询造成请求过多。
  max_body_candidates: 60
  body_fetch_workers: 8
  # 送入终评模型的单篇正文最大字符数。
  body_max_chars: 6000
  # 正文指纹 Jaccard 相似度达到此值即视为转载/重复（标题不同也会去重）。
  body_dedupe_threshold: 0.90
  assessment_batch_size: 10

# ---------- 周度情报观察 ----------
insights:
  enabled: true

# ---------- Google News 关键词搜索 ----------
# 按板块分组,当日只抓当日板块对应的 queries；检索式遵循 keyword.md 的
# 「主体词 × 信号词」原则：空格=且(AND)，同义词用 OR，英文专有短语用双引号。
# 搜索窗口 7d(配合一周推送一次的节奏)。
google_news:
  # 每个查询最多保留的结果数(Google 已按相关度排序)，控制粗筛 token 成本
  max_per_query: 30

google_news_queries:
  industry:
    - '灯塔工厂 新增 名单'
    - '灯塔工厂 WEF 世界经济论坛'
    - '"lighthouse factory" WEF manufacturing'
    - '黑灯工厂 OR 熄灯工厂 OR 无人化工厂 投产'
    - '智能制造示范工厂 揭榜 OR 名单'
    - '卓越级智能工厂 OR 领航级智能工厂'
    - '5G全连接工厂 建成 OR 名单'
    - '双跨平台 OR 跨行业跨领域工业互联网平台'
    - '盘古大模型 OR 矿山大模型 OR 钢铁大模型 落地'
    - '卡奥斯 COSMOPlat OR 树根互联 OR 美云智数'
    - '西门子 Xcelerator OR 西门子成都灯塔工厂'
    - '世界智能制造大会 OR 中国国际工业博览会 OR 汉诺威工业博览会'
    - '专精特新 小巨人 名单'
    - '"人工智能+" 制造 实施方案 OR 行动'
    - '智能制造 能力成熟度 OR CMMM 评估'
    - '新质生产力 智能制造 OR 新型工业化'
    - '工业富联 OR 富士康 灯塔工厂'

  research:
    - '工业大模型 发布 OR 签约 OR 落地'
    - '工业智能体 OR "AI Agent" 制造 应用'
    - 'AI质检 OR 缺陷检测 OR 视觉质检 上线 OR 案例'
    - '预测性维护 OR 故障诊断 OR PHM 案例 OR 上线'
    - '数字孪生 工厂 OR 产线 平台'
    - '人形机器人 进厂 OR 车间 OR 装配 OR 分拣'
    - '"humanoid robot" factory OR assembly OR welding'
    - '协作机器人 OR Cobot 工厂 部署'
    - '焊接机器人 OR 打磨机器人 OR 装配机器人'
    - 'AMR OR AGV 集群调度 OR 智能仓储'
    - '工业软件 国产替代 OR 国产化'
    - 'CAE OR EDA 国产 突破'
    - '五轴联动 OR 高端数控机床 突破 OR 量产'
    - '增材制造 OR 金属3D打印 突破 OR 量产'
    - '"large language model" "process industry" OR manufacturing'
    - '"digital twin" "shop floor" OR "production line"'
    - '"defect detection" deep learning manufacturing'
    - '"predictive maintenance" machine learning'

  academia:
    - '智能制造工程 专业 审批 OR 备案'
    - '国家卓越工程师学院 名单 OR 招生 OR 建设'
    - '现代产业学院 名单 OR 建设'
    - '市域产教联合体 OR 行业产教融合共同体'
    - '产教融合 智能制造 实训 OR 基地'
    - '西门子杯 智能制造挑战赛 报名 OR 赛题 OR 获奖'
    - '中国国际大学生创新大赛 OR 挑战杯 获奖 OR 报名'
    - '大学生创新创业训练计划 立项 OR 申报'
    - 'RoboMaster OR 全国大学生机器人大赛 报名 OR 结果'
    - '全国大学生智能汽车竞赛 OR 机械创新设计大赛'
    - '数学建模 国赛 OR 美赛 报名 OR 获奖'
    - '智能制造 校招 OR 实习 工程师 岗位'
    - '人工智能 微专业 OR 通识课 高校'
    - '"intelligent manufacturing" university program students'

# ---------- 直接订阅的 RSS 源 ----------
# 全部源每次都抓,由 scorer 判断与当日板块是否相关
# tier: primary=一手机构/公司原始发布；trusted=可信媒体或研究机构。
rss_feeds:
  # ── 智能制造/机器人行业垂直媒体 ──
  - name: "The Robot Report"
    url: "https://www.therobotreport.com/feed/"
    tier: primary
  - name: "Manufacturing Dive"
    url: "https://www.manufacturingdive.com/feeds/news/"
    tier: primary
  - name: "IEEE Spectrum Robotics"
    url: "https://spectrum.ieee.org/feeds/topic/robotics.rss"
    tier: trusted

  # ── 中文科技/AI 媒体 ──
  - name: "机器之心"
    url: "https://www.jiqizhixin.com/rss"
    tier: trusted
  - name: "量子位"
    url: "https://www.qbitai.com/feed"
    tier: trusted
  - name: "36氪"
    url: "https://36kr.com/feed"
    tier: trusted
  - name: "钛媒体"
    url: "https://www.tmtpost.com/feed"
    tier: trusted

  # ── 国际科技媒体(工业 AI 视角) ──
  - name: "IEEE Spectrum"
    url: "https://spectrum.ieee.org/rss"
    tier: trusted
  - name: "MIT Tech Review AI"
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
    tier: trusted
  - name: "TechCrunch"
    url: "https://techcrunch.com/feed/"
    tier: trusted

# 可选：在 rss_feeds 里继续添加，如 高工机器人 / e-works / 工信部等站点的可用 RSS
# 或经 RSSHub 包装的源；抓取失败的源会被跳过并记录日志，不影响整体运行。

# ---------- RSSHub 路由（用于 X / 微信公众号）----------
rsshub:
  instance: "https://rsshub.app"
  routes: []
  # RSSHub 公共实例不稳定,重度使用建议自部署
  # - name: "高工机器人"
  #   path: "/gg-robot/news"

# ---------- 源采集配置 ----------
sources:
  # 文章发布时间窗口（小时）。早于此窗口的丢弃。
  # RSS 源不分页会返回全量历史,必须靠这个收口。
  # 每周推送一次,窗口设为 7 天(168h)，与 keyword.md「采集偏好」一致。
  max_age_hours: 168
  # 普通源没有发布时间时不强行丢弃，避免兼容性过差；有发布时间的旧闻仍会过滤。
  require_published: false

# ---------- 去重配置 ----------
state:
  # 已推送文章记录保留天数（防止反复推同一篇）
  retention_days: 30
  # 已推送事件(标题 + event_key)保留天数：期间同一事件换媒体/换标题再报道不再推送
  event_retention_days: 21
  # 新文章标题与已推送标题的相似度达到此值即视为同一事件(0-1，越高越保守)
  history_title_threshold: 0.8
