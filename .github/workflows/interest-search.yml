name: Personalized interest search
run-name: Interest search ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      interests:
        description: '所选关键词的 JSON 数组'
        required: true
        type: string
      request_id:
        description: '调用方生成的任务标识'
        required: true
        type: string
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search selected interests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEARCH_INTERESTS: ${{ inputs.interests }}
        run: python -m cxy_agent.interest_search
      - uses: actions/upload-artifact@v4
        with:
          name: interest-result
          path: interest-result.json
          retention-days: 1
